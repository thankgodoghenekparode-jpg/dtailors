<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Main App Icon Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="50%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <!-- Metallic Gold Scissors Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="30%" stop-color="#fef08a" />
      <stop offset="70%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Subtle Inner Glow Shadow -->
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#7c2d12" flood-opacity="0.35" />
    </filter>

    <!-- Thread Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base for App Icon -->
  <rect x="16" y="16" width="480" height="480" rx="108" ry="108" fill="url(#bgGrad)" />

  <!-- Subtle Inner Border Accent -->
  <rect x="24" y="24" width="464" height="464" rx="100" ry="100" fill="none" stroke="#ffffff" stroke-opacity="0.2" stroke-width="4" />

  <!-- D Monogram Thread Loop -->
  <path d="M 200 130 C 330 130 380 190 380 256 C 380 322 330 382 200 382" 
        fill="none" 
        stroke="#fef3c7" 
        stroke-width="18" 
        stroke-linecap="round" 
        stroke-dasharray="14 10"
        opacity="0.85"
        filter="url(#glow)" />

  <!-- Tailor Scissors Group -->
  <g filter="url(#dropShadow)">
    <!-- Left Blade & Right Handle Loop -->
    <path d="M 175 140 L 320 340 A 32 32 0 1 1 270 375 L 175 245 Z" fill="url(#goldGrad)" />
    
    <!-- Right Blade & Left Handle Loop -->
    <path d="M 337 140 L 192 340 A 32 32 0 1 0 242 375 L 337 245 Z" fill="url(#goldGrad)" />

    <!-- Left Handle Loop Hole -->
    <circle cx="180" cy="355" r="18" fill="url(#bgGrad)" />

    <!-- Right Handle Loop Hole -->
    <circle cx="332" cy="355" r="18" fill="url(#bgGrad)" />

    <!-- Center Pivot Screw / Gold Accent Ring -->
    <circle cx="256" cy="256" r="16" fill="#ffffff" stroke="#d97706" stroke-width="4" />
    <circle cx="256" cy="256" r="6" fill="#9a3412" />
  </g>
</svg>
