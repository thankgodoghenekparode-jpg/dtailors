<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Exact D Tailors App Icon Gradient (from-primary-600 via-primary-500 to-accent-500) -->
    <linearGradient id="pwaLogoGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ea580c" />
      <stop offset="50%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- Subtle Drop Shadow for Scissors -->
    <filter id="pwaShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#7c2d12" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Rounded Squircle Box -->
  <rect x="16" y="16" width="480" height="480" rx="110" ry="110" fill="url(#pwaLogoGrad)" />

  <!-- Lucide Scissors Emblem in White -->
  <g filter="url(#pwaShadow)" stroke="#ffffff" stroke-width="32" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Circle Handles -->
    <circle cx="160" cy="352" r="44" fill="none" />
    <circle cx="352" cy="352" r="44" fill="none" />
    
    <!-- Criss-cross Blades -->
    <path d="M 191 321 L 352 144" />
    <path d="M 160 144 L 235 226" />
    <path d="M 277 272 L 321 321" />

    <!-- Center Pivot Screw -->
    <circle cx="256" cy="256" r="10" fill="#ffffff" stroke="none" />
  </g>
</svg>
